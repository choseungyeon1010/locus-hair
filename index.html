<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LOCUS [승연] PRO</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
          },
          colors: {
            dark: {
              bg: '#0c0d0e',
              card: '#16181a',
              cardHover: '#1c1e22',
              border: '#26292d',
            },
            accent: {
              green: '#22c55e',
              greenDark: '#14532d',
              greenLight: '#4ade80',
              yellow: '#facc15',
              yellowDark: '#ca8a04',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #0c0d0e;
      color: #e5e7eb;
      -webkit-tap-highlight-color: transparent;
    }
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(12, 13, 14, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .timer-active {
      border-color: #22c55e !important;
      background-color: rgba(34, 197, 94, 0.12) !important;
      color: #4ade80 !important;
    }
    .pulse-dot {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.15); }
    }
  </style>
</head>
<body class="min-h-screen pb-12 antialiased selection:bg-emerald-800 selection:text-white">

  <!-- Top App Brand Bar -->
  <div class="px-4 py-2.5 max-w-md mx-auto flex items-center justify-between border-b border-dark-border bg-dark-bg">
    <div class="flex items-center space-x-2">
      <span class="text-sm font-bold tracking-tight text-white">LOCUS [승연] PRO</span>
    </div>
    <div class="flex items-center space-x-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500/50 pulse-dot"></span>
    </div>
  </div>

  <!-- STICKY TOP CONTAINER: Clock & Timers & Subheader (항상 상단 고정) -->
  <div class="sticky-header border-b border-dark-border px-4 pt-3 pb-3">
    <div class="max-w-md mx-auto space-y-2.5">
      
      <!-- Digital Clock Card -->
      <div class="bg-dark-card border border-dark-border rounded-2xl p-3 text-center shadow-lg">
        <div id="mainClock" class="text-4xl sm:text-5xl font-black font-mono tracking-wider text-white">
          00:00:00
        </div>
        
        <!-- Timer A & Timer B (원클릭 시작, 재클릭 초기화) -->
        <div class="grid grid-cols-2 gap-2 mt-2.5">
          <button id="timerABtn" onclick="toggleTimer('A')" class="flex items-center justify-between px-3 py-2 rounded-xl bg-dark-bg border border-dark-border text-xs font-semibold text-gray-300 hover:border-gray-500 active:scale-95 transition">
            <span class="text-gray-400">타이머 A</span>
            <span id="timerADisplay" class="font-mono text-sm font-bold text-white">00:00</span>
          </button>
          <button id="timerBBtn" onclick="toggleTimer('B')" class="flex items-center justify-between px-3 py-2 rounded-xl bg-dark-bg border border-dark-border text-xs font-semibold text-gray-300 hover:border-gray-500 active:scale-95 transition">
            <span class="text-gray-400">타이머 B</span>
            <span id="timerBDisplay" class="font-mono text-sm font-bold text-white">00:00</span>
          </button>
        </div>
      </div>

      <!-- Next Customer Status Subheader -->
      <div class="flex items-center justify-between text-xs px-1 text-gray-400">
        <span id="nextCustomerBanner" class="font-medium text-gray-300">다음 고객 김세웅님 · 대기 중</span>
        <span id="syncStatus" class="text-[11px] text-emerald-500">실시간 연동</span>
      </div>

    </div>
  </div>

  <!-- Main Scrollable Content -->
  <main class="max-w-md mx-auto px-4 pt-3 space-y-3.5">

    <!-- KPI Summary Cards (2 Columns: 총 예약 & 예상 매출 / 지정 & 미지정 현황) -->
    <div class="grid grid-cols-2 gap-2.5">
      <div class="bg-dark-card border border-dark-border rounded-2xl p-3.5">
        <div class="text-[11px] text-gray-400 font-medium">당일 총 예약</div>
        <div class="flex items-baseline space-x-1 mt-0.5">
          <span id="kpiTotalCount" class="text-3xl font-extrabold text-emerald-400 font-mono">11</span>
          <span class="text-xs text-gray-400">건</span>
        </div>
        <div class="text-[11px] text-gray-400 mt-0.5" id="kpiRevenueText">예상 매출 212,000원</div>
      </div>

      <div class="bg-dark-card border border-dark-border rounded-2xl p-3.5">
        <div class="text-[11px] text-gray-400 font-medium">고객 구분</div>
        <div class="flex items-baseline space-x-1 mt-0.5">
          <span id="kpiDesignatedCount" class="text-3xl font-extrabold text-white font-mono">8</span>
          <span class="text-xs text-gray-400">건 지정</span>
        </div>
        <div class="text-[11px] text-gray-400 mt-0.5" id="kpiUndesignatedText">미지정 3건</div>
      </div>
    </div>

    <!-- Day Tabs: TODAY / TOMORROW / DAY AFTER -->
    <div class="grid grid-cols-3 gap-1.5 p-1 bg-dark-card border border-dark-border rounded-2xl text-xs font-semibold">
      <button id="dayTab-today" onclick="setDay('today')" class="py-2 rounded-xl text-center transition font-bold bg-emerald-950/80 text-emerald-400 border border-emerald-800">
        <div>TODAY</div>
        <div class="text-[11px] font-normal mt-0.5" id="todayTabCount">11건</div>
      </button>
      <button id="dayTab-tomorrow" onclick="setDay('tomorrow')" class="py-2 rounded-xl text-center text-gray-400 hover:text-gray-200 transition">
        <div>TOMORROW</div>
        <div class="text-[11px] font-normal mt-0.5" id="tomorrowTabCount">11건</div>
      </button>
      <button id="dayTab-dayafter" onclick="setDay('dayafter')" class="py-2 rounded-xl text-center text-gray-400 hover:text-gray-200 transition">
        <div>DAY AFTER</div>
        <div class="text-[11px] font-normal mt-0.5" id="dayafterTabCount">3건</div>
      </button>
    </div>

    <!-- Current Date Heading & Timeline Bar -->
    <div class="pt-1">
      <div class="text-sm font-bold text-emerald-400" id="currentSectionDate">11월 13일 금요일</div>
      
      <!-- Red dot progress indicator line -->
      <div class="flex items-center justify-between text-[11px] text-rose-400 mt-1 mb-1">
        <div class="flex items-center space-x-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-rose-500 inline-block"></span>
          <span id="timelineProgressText">01:38 · 실시간 영업 대기</span>
        </div>
      </div>
      <div class="w-full bg-dark-card h-1 rounded-full overflow-hidden">
        <div class="bg-gradient-to-r from-rose-500 to-amber-500 h-full w-1/4 rounded-full"></div>
      </div>
    </div>

    <!-- Reservation Cards List -->
    <div id="reservationContainer" class="space-y-2.5 pt-1">
      <!-- Dynamically generated list -->
    </div>

  </main>

        reservations: [

          { id: 105, period: "오후", time: "1:00", name: "박철우님", service: "새치 염색 (남)", price: 20000, status: "pending", phone: "010-3749-1986", customerType: "지정", visitInfo: "최근 13일 전 (10/31)" },
          { id: 106, period: "오후", time: "1:30", name: "백차홍님", service: "아이롱 (남) + 새치 염색 (남) + 두피 크리닉 (남성)", price: 100000, status: "pending", phone: "010-5161-5070", customerType: "지정", visitInfo: "최근 17일 전 (10/27)" },

          { id: 108, period: "오후", time: "4:30", name: "이연주님", service: "남자컷", price: 12000, status: "pending", phone: "010-8650-6371", customerType: "지정", visitInfo: "최근 54일 전 (09/20)" },
          { id: 109, period: "오후", time: "5:00", name: "이연주님", service: "남학생컷", price: 10000, status: "pending", phone: "010-8650-6371", customerType: "지정", visitInfo: "최근 54일 전 (09/20)" },
          { id: 110, period: "오후", time: "5:30", name: "천성철님", service: "남자컷", price: 12000, status: "pending", phone: "010-4544-7689", customerType: "지정", visitInfo: "최근 48일 전 (09/26)" },
          { id: 111, period: "오후", time: "6:30", name: "유경민님", service: "남자컷", price: 12000, status: "pending", phone: "010-5003-1854", customerType: "지정", visitInfo: "최근 14일 전 (10/30)" }
        ]
      },
      dayafter: {
        dateLabel: "11월 15일 일요일",
        reservations: [
          { id: 201, period: "오전", time: "10:00", name: "신홍주님", service: "남자컷 + 샴푸 (남성)", price: 17000, status: "pending", phone: "010-6282-9704", customerType: "지정", visitInfo: "최근 20일 전 (10/24)" },
          { id: 202, period: "오후", time: "2:00", name: "이지영님", service: "남자컷", price: 12000, status: "pending", phone: "010-7172-6334", customerType: "지정", visitInfo: "최근 10일 전 (11/03)" },
          { id: 203, period: "오후", time: "3:00", name: "신초롱님", service: "남자컷", price: 12000, status: "pending", phone: "010-3755-6293", customerType: "지정", visitInfo: "최근 33일 전 (10/11)" }
        ]
      }
    };

    let currentDay = 'today';

    // TIMERS LOGIC: 클릭 시 시작, 재클릭 시 00:00 초기화
    const timers = {
      A: { seconds: 0, interval: null, running: false },
      B: { seconds: 0, interval: null, running: false }
    };

    function toggleTimer(name) {
      const t = timers[name];
      const btn = document.getElementById(`timer${name}Btn`);
      const disp = document.getElementById(`timer${name}Display`);

      if (!t.running) {
        t.running = true;
        btn.classList.add('timer-active');
        t.interval = setInterval(() => {
          t.seconds++;
          const m = String(Math.floor(t.seconds / 60)).padStart(2, '0');
          const s = String(t.seconds % 60).padStart(2, '0');
          disp.innerText = `${m}:${s}`;
        }, 1000);
      } else {
        t.running = false;
        clearInterval(t.interval);
        t.seconds = 0;
        disp.innerText = "00:00";
        btn.classList.remove('timer-active');
      }
    }

    // MAIN CLOCK LOGIC
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('mainClock').innerText = `${h}:${m}:${s}`;

      const target = new Date();
      target.setHours(10, 30, 0, 0);
      let diffMs = target - now;
      if (diffMs > 0) {
        const diffMin = Math.floor(diffMs / 60000);
        document.getElementById('nextCustomerBanner').innerText = `다음 고객 김세웅님 · ${diffMin}분 남음`;
        document.getElementById('timelineProgressText').innerText = `${h}:${m} · 다음 ${diffMin}분 후`;
      } else {
        document.getElementById('nextCustomerBanner').innerText = `김세웅님 시술 시간 대기`;
        document.getElementById('timelineProgressText').innerText = `${h}:${m} · 실시간 영업 대기`;
      }
    }

    function setDay(dayKey) {
      currentDay = dayKey;
      ['today', 'tomorrow', 'dayafter'].forEach(d => {
        const btn = document.getElementById(`dayTab-${d}`);
        if (d === dayKey) {
          btn.className = "py-2 rounded-xl text-center transition font-bold bg-emerald-950/80 text-emerald-400 border border-emerald-800";
        } else {
          btn.className = "py-2 rounded-xl text-center text-gray-400 hover:text-gray-200 transition";
        }
      });

      document.getElementById('currentSectionDate').innerText = DATA[dayKey].dateLabel;
      renderReservations();
    }

    function renderReservations() {
      const dayData = DATA[currentDay];
      const list = dayData.reservations;

      const total = list.length;
      const totalRev = list.reduce((acc, r) => acc + (r.price || 0), 0);
      const designatedCount = list.filter(r => (r.customerType || r.customer_type || '').includes('지정')).length;
      const undesignatedCount = total - designatedCount;

      document.getElementById('kpiTotalCount').innerText = total;
      document.getElementById('kpiRevenueText').innerText = `예상 매출 ${totalRev.toLocaleString()}원`;
      document.getElementById('kpiDesignatedCount').innerText = designatedCount;
      document.getElementById('kpiUndesignatedText').innerText = `미지정 ${undesignatedCount}건`;

      document.getElementById('todayTabCount').innerText = `${DATA.today.reservations.length}건`;
      document.getElementById('tomorrowTabCount').innerText = `${DATA.tomorrow.reservations.length}건`;
      document.getElementById('dayafterTabCount').innerText = `${DATA.dayafter.reservations.length}건`;
      document.getElementById('currentSectionDate').innerText = DATA[currentDay].dateLabel;

      const container = document.getElementById('reservationContainer');
      if (list.length === 0) {
        container.innerHTML = `
          <div class="py-12 text-center text-gray-500 text-xs bg-dark-card rounded-2xl border border-dark-border">
            예약이 없습니다.
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(item => {
        // Customer Type Badge
        const cType = item.customerType || item.customer_type || '';
        const isDesignated = cType.includes('지정');
        const isNew = cType.includes('신규');
        const typeBadge = isNew
          ? `<span class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-amber-950 text-amber-300 border border-amber-800 shrink-0">신규</span>`
          : isDesignated
          ? `<span class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-purple-950 text-purple-300 border border-purple-800 shrink-0">지정</span>`
          : `<span class="px-2 py-0.5 rounded-md text-[11px] font-medium bg-gray-800 text-gray-400 shrink-0">미지정</span>`;

        const visitInfoText = item.visitInfo || item.visit_info || '';

        return `
          <div class="bg-dark-card border border-dark-border rounded-2xl p-3.5 flex items-center justify-between gap-3 transition">
            
            <!-- Left: Time (Yellow/Gold 大형 폰트: text-2xl/3xl) -->
            <div class="w-20 shrink-0 text-left">
              <div class="text-xs font-semibold text-gray-400 tracking-wider">${item.period}</div>
              <div class="text-2xl sm:text-3xl font-black font-mono tracking-tight text-accent-yellow mt-0.5">${item.time}</div>
            </div>

            <!-- Middle: Customer Name (text-lg/xl font-extrabold), Badge, Visit Interval, Dark Gray Phone -->
            <div class="flex-1 min-w-0 pr-1">
              <div class="flex items-center space-x-1.5 flex-wrap gap-y-1">
                <span class="font-extrabold text-lg sm:text-xl text-white tracking-tight truncate">${item.name}</span>
                ${typeBadge}
              </div>
              
              <!-- 방문 주기 (말줄임 없이 자연스럽게 표출) -->
              <div class="text-xs text-gray-300 font-medium mt-1 truncate">
                ${visitInfoText}
              </div>

              <!-- 연락처: 중요도가 낮으므로 가독성을 낮춘 어두운 회색 계열 (#71717a) -->
              <div class="text-[11px] text-zinc-500 font-mono mt-1 flex items-center space-x-1">
                <svg class="w-3 h-3 text-zinc-600 inline shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                <a href="tel:${(item.phone || '').replace(/-/g, '')}" class="text-zinc-500 hover:text-zinc-300 transition tracking-wide font-normal">${item.phone || ''}</a>
              </div>
            </div>

            <!-- Right: Service Name & Green Total Price (말줄임 없이 자동 줄바꿈으로 전체 정보 표시, 시작/완료 버튼 완전 제거) -->
            <div class="text-right shrink-0 max-w-[42%] flex flex-col justify-center">
              <div class="text-xs font-semibold text-emerald-400 break-words leading-relaxed whitespace-normal">
                ${item.service}
              </div>
              <div class="text-xs sm:text-sm font-extrabold text-emerald-400 font-mono mt-1 whitespace-nowrap">
                총 ${item.price.toLocaleString()}원
              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    // Auto fetch live json every 30s
    async function fetchLiveFeed() {
      try {
        const res = await fetch('reservations_live.json?t=' + Date.now());
        if (res.ok) {
          const live = await res.json();
          const normalize = (r) => ({
            id: r.id,
            period: r.period,
            time: r.time,
            name: r.name,
            service: r.service,
            price: r.price,
            status: r.status,
            phone: r.phone,
            customerType: r.customer_type || r.customerType || (r.assigned ? '지정' : '미지정'),
            visitInfo: r.visit_info || r.visitInfo || ''
          });
          if (live.today && live.today.reservations) {
            DATA.today.reservations = live.today.reservations.map(normalize);
            if (live.today.day_label) DATA.today.dateLabel = live.today.day_label;
          }
          if (live.tomorrow && live.tomorrow.reservations) {
            DATA.tomorrow.reservations = live.tomorrow.reservations.map(normalize);
            if (live.tomorrow.day_label) DATA.tomorrow.dateLabel = live.tomorrow.day_label;
          }
          if (live.dayafter && live.dayafter.reservations) {
            DATA.dayafter.reservations = live.dayafter.reservations.map(normalize);
            if (live.dayafter.day_label) DATA.dayafter.dateLabel = live.dayafter.day_label;
          }
          renderReservations();
          document.getElementById('syncStatus').innerText = '자동 동기화 완료';
        }
      } catch (e) {}
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateClock();
      setInterval(updateClock, 1000);
      renderReservations();
      setInterval(fetchLiveFeed, 30000);
    });
  </script>
</body>
</html>
